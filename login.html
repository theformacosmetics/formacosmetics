<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Forma</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="auth-wrap">
    <section class="auth-side">
      <div class="brand">FORMA</div>
      <p>Sales, stock, batches and books for Forma Cosmetics, in one place.</p>
    </section>
    <section class="auth-main">
      <form class="auth-form" id="loginForm" novalidate>
        <h1>Sign in</h1>
        <div class="field" id="f-email">
          <label for="email">Email</label>
          <input class="input" id="email" type="email" autocomplete="username" required>
        </div>
        <div class="field" id="f-password">
          <label for="password">Password</label>
          <input class="input" id="password" type="password" autocomplete="current-password" required>
        </div>
        <div class="field"><span class="error" id="formError" role="alert"></span></div>
        <button class="btn" id="submitBtn" type="submit">Sign in</button>
        <p class="muted">Accounts are created by an admin in Supabase Authentication.</p>
      </form>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
